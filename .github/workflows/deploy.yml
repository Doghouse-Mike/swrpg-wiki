name: Deploy Quartz site to GitHub Pages

# The notes live in a separate repo (Doghouse-Mike/SWRPG-Obsidian-Vault) and
# are checked out into content/ on every build, so the site always shows the
# vault's latest commit. Rebuilds on: a push here, a manual run, a nightly
# schedule, or a `vault-updated` repository_dispatch from the vault repo.
on:
  push:
    branches:
      - v5
  workflow_dispatch:
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the vault
        uses: actions/checkout@v7
        with:
          repository: Doghouse-Mike/SWRPG-Obsidian-Vault
          path: content
          fetch-depth: 0 # page dates come from the vault's git history
      - name: Make the homepage
        run: python3 tools/make-index.py content
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache downloaded theme
        uses: actions/cache@v6
        with:
          path: .quartz-cache/quartz-themes
          key: ${{ runner.os }}-themes-${{ hashFiles('quartz.config.yaml') }}
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Sanity check
        # A broken theme/plugin can still "build" an empty site. Fail loudly.
        run: |
          test "$(find public -name '*.html' | wc -l)" -gt 3000
          grep -q 'Edge of the Empire' public/index.html
          grep -q '<tr' public/bases/armoury.base.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
